<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Samuel Edwards — BSc Biomedical Science graduate and MSc Cancer student.">
  <title>Samuel Edwards</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <a class="skip-link" href="#hero-content">Skip to main content</a>

  <header class="site-header" role="banner">
    <a href="/" class="header-logo" aria-label="Samuel Edwards — home">SE</a>

    <nav class="header-nav" id="site-nav" aria-label="Site navigation">
      <a href="#about">About</a>
      <a href="#education">Education</a>
      <a href="#experience">Experience</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>

    <button
      class="nav-toggle"
      id="nav-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="site-nav"
      aria-label="Open navigation menu"
    >
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </header>

  <main>
    <section class="hero" id="hero" aria-labelledby="hero-name">

      <div class="hero-bg" aria-hidden="true">
        <div class="hero-bg-image"></div>
        <div class="hero-overlay"></div>
      </div>

      <div class="hero-content" id="hero-content">
        <h1 class="hero-name" id="hero-name">Samuel<br>Edwards</h1>
        <p class="hero-subtitle">BSc Biomedical Science graduate&nbsp;&middot;&nbsp;MSc Cancer student</p>
        <div class="hero-actions">
          <a href="Samuel-Edwards-CV.pdf" class="btn btn-primary" download>Download CV</a>
          <a href="#projects" class="btn btn-secondary">View Projects</a>
        </div>
      </div>

    </section>

    <!-- Minimal anchor placeholders for navigation -->
    <div id="about"      aria-hidden="true"></div>
    <div id="education"  aria-hidden="true"></div>
    <div id="experience" aria-hidden="true"></div>
    <div id="projects"   aria-hidden="true"></div>
    <div id="contact"    aria-hidden="true"></div>
  </main>

  <script>
    /* Mobile navigation toggle */
    (function () {
      var btn = document.getElementById('nav-toggle');
      var nav = document.getElementById('site-nav');
      if (!btn || !nav) return;

      function setOpen(open) {
        btn.setAttribute('aria-expanded', String(open));
        btn.setAttribute('aria-label', open ? 'Close navigation menu' : 'Open navigation menu');
        nav.classList.toggle('nav-open', open);
        document.body.classList.toggle('nav-active', open);
      }

      btn.addEventListener('click', function () {
        setOpen(btn.getAttribute('aria-expanded') !== 'true');
      });

      nav.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', function () { setOpen(false); });
      });
    }());

    /* Ambient background drift + subtle pointer parallax */
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var bg = document.querySelector('.hero-bg-image');
      if (!bg) return;

      var targetX = 0, targetY = 0;
      var currentX = 0, currentY = 0;
      var t = 0;

      document.addEventListener('mousemove', function (e) {
        targetX = (e.clientX / window.innerWidth  - 0.5) * 16;
        targetY = (e.clientY / window.innerHeight - 0.5) * 10;
      });

      function tick() {
        t += 0.00025;
        /* Very slow sinusoidal ambient drift — period ~380s per cycle */
        var ambX  = Math.sin(t * 1.1) * 7;
        var ambY  = Math.cos(t * 0.8) * 5;
        var scale = 1.07 + Math.sin(t * 0.5) * 0.01;
        /* Smooth lerp toward pointer */
        currentX += (targetX - currentX) * 0.025;
        currentY += (targetY - currentY) * 0.025;
        bg.style.transform =
          'scale(' + scale.toFixed(4) + ') ' +
          'translate(' + (ambX + currentX).toFixed(2) + 'px, ' +
                         (ambY + currentY).toFixed(2) + 'px)';
        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    }());
  </script>

</body>
</html>
